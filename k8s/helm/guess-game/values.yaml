namespace: guess-game

backend:
  image:
    repository: docker.io/bryanwille/guess-game-backend
    tag: 1.0.0
    pullPolicy: Always
  replicas: 2
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    averageUtilization: 60

frontend:
  image:
    repository: docker.io/bryanwille/guess-game-frontend
    tag: 1.0.0
    pullPolicy: Always
  replicas: 1
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  image: postgres:16-alpine
  database: guessgame
  user: guessgame
  password: guesspass
  service:
    port: 5432
  persistence:
    size: 1Gi
